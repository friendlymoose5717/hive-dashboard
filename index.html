<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Hive Account Health Dashboard</title>

    <style>
        /* ----------------------------------------------------
           GLOBAL
        ---------------------------------------------------- */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: #e5e7eb;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        /* ----------------------------------------------------
           HEADER
        ---------------------------------------------------- */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header img {
            width: 160px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        /* ----------------------------------------------------
           INPUT + BUTTON (BLUE THEME)
        ---------------------------------------------------- */
        input#username {
            width: 70%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b82f6;
            background: #1e3a8a;
            color: #e5e7eb;
            outline: none;
            transition: 0.2s;
        }

        input#username::placeholder {
            color: #cbd5e1;
        }

        input#username:focus {
            background: #1e40af;
            border-color: #60a5fa;
            box-shadow: 0 0 8px rgba(96,165,250,0.4);
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            margin-left: 8px;
            transition: 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        /* ----------------------------------------------------
           GRID + CARDS
        ---------------------------------------------------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: #111827;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #1f2937;
            transition: 0.25s;
        }

        .card.ok {
            background: #064e3b;
            border-color: #10b981;
        }

        .card.warning {
            background: #4a3a00;
            border-color: #f59e0b;
        }

        .card.danger {
            background: #7f1d1d;
            border-color: #ef4444;
        }

        .card.loading {
            background: #1f2937;
            border-color: #374151;
            opacity: 0.6;
        }

        .label {
            font-size: 12px;
            opacity: 0.7;
        }

        .value {
            font-size: 22px;
            margin-top: 6px;
            font-weight: bold;
        }



        /* ----------------------------------------------------
           MISC
        ---------------------------------------------------- */
        .danger-row {
            background: #3f0d0d;
        }

        /* ----------------------------------------------------
           TABLES — COOL DARK THEME
        ---------------------------------------------------- */
.data-table {
    width: 100%;
    border-collapse: collapse;
    background: #0d1628;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
    box-shadow: 0 0 14px rgba(0,0,0,0.45);
}

/* HEADER ROW */
.data-table thead th {
    background: #1b2b4a;
    color: #e5e7eb;
    padding: 12px;
    font-size: 1.1em;
    text-align: left;
    border-bottom: 1px solid #2c3e5f;
}

/* BODY CELLS */
.data-table td,
.data-table th {
    padding: 10px 12px;
    border-bottom: 1px solid #1a2438;
}

/* ODD ROWS */
.data-table tbody tr:nth-child(odd) {
    background: #111c30;
}

/* EVEN ROWS */
.data-table tbody tr:nth-child(even) {
    background: #162238;
}

/* HOVER */
.data-table tbody tr:hover {
    background: #1f2f4a;
}

/* DANGER ROW — amber ipv rood */
.data-table .danger-row td {
    background: #3a2a12;
    color: #fbbf24;
    font-weight: 600;
}

        
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="https://developers.hive.io/images/logotype_black.svg">
        <h1>Hive Account Health Dashboard</h1>
    </div>

    <div>
        <input id="username" placeholder="username" />
        <button id="checkBtn">Check</button>
    </div>

    <!-- Dashboard content gets injected here -->
    <div id="dashboard"></div>

</div>

<footer style="margin-top:40px; text-align:center; opacity:0.85; font-size:0.9rem;">
