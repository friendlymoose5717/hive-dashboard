<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Account health stats</title>

    <style>
        /* ---------- GLOBAL ---------- */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: #e5e7eb;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header img {
            width: 160px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        input {
            width: 70%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #1f2937;
            color: #e5e7eb;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            margin-left: 8px;
            transition: 0.2s;
        }

        button:hover {
            background: #16a34a;
        }

        /* ---------- GRID ---------- */

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ---------- CARDS ---------- */

        .card {
            background: #111827;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #1f2937;
            transition: 0.25s;
        }

        /* STATUS COLORS */

        .card.ok {
            background: #064e3b;
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
        }

        .card.warning {
            background: #4a3a00;
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
        }

        .card.danger {
            background: #7f1d1d;
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.25);
        }

        .card.loading {
            background: #1f2937;
            border-color: #374151;
            opacity: 0.6;
        }

        /* TEXT INSIDE CARDS */

        .label {
            font-size: 12px;
            opacity: 0.7;
        }

        .value {
            font-size: 22px;
            margin-top: 6px;
            font-weight: bold;
        }

        /* ---------- TABLES ---------- */

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: #111827;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #1f2937;
            text-align: left;
        }

        th {
            background: #0f172a;
        }

        .danger-row {
            background: #3f0d0d;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="https://developers.hive.io/images/logotype_black.svg">
        <h1>Account health stats</h1>
    </div>

    <div>
        <input id="username" placeholder="username" />
        <button onclick="checkUser()">Check</button>
    </div>

    <div id="dashboard"></div>

</div>

<footer style="margin-top:40px; text-align:center; opacity:0.6; font-size:0.85rem;">
    <img src="https://files.peakd.com/file/peakd-hive/friendlymoose/avatar.png"
         alt="Friendlymoose avatar"
         style="width:40px; height:40px; border-radius:50%; display:block; margin:0 auto 6px auto;">
    Created by 
    <a href="https://peakd.com/@friendlymoose"
       target="_blank"
       style="color:#e5e7eb; text-decoration:underline;">
       Friendlymoose
    </a>
</footer>

<script src="app.js"></script>

</body>
</html>
